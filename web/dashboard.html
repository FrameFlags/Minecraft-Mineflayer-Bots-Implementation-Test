<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServerBots — dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="title">ServerBots</span>
      <span class="muted">remote dashboard</span>
    </div>
    <div class="header-right">
      <span id="conn" class="muted">connecting…</span>
      <a href="/index.html" class="link">single-bot view</a>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="side-head">BOTS</div>
      <ul id="bots"></ul>
    </nav>

    <main class="main">
      <div id="now" class="now muted">pick a bot</div>
      <div id="feed" class="feed" aria-live="polite"></div>
    </main>
  </div>

  <footer>
    <form id="cmd-form" class="input-row">
      <input id="cmd" type="text" autocomplete="off" disabled
             placeholder="Command — e.g. /status, /containershow, /take tnt">
      <button type="submit" disabled>Run</button>
    </form>
  </footer>

  <script src="/dashboard.js"></script>
</body>
</html>
